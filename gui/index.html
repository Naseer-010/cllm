<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cllm Flasher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>cllm Flasher</h1>
        </header>

        <main>
            <!-- Model Section -->
            <section class="card">
                <h2>Model</h2>
                
                <div class="tabs">
                    <button class="tab-btn active" data-target="hf-tab">Download from HuggingFace</button>
                    <button class="tab-btn" data-target="local-tab">Upload Local File</button>
                </div>

                <div class="tab-content active" id="hf-tab">
                    <label for="hf-model-select">Select a model:</label>
                    <select id="hf-model-select" class="form-control">
                        <option value="" disabled selected>Select a model to download...</option>
                        <optgroup label="Small (1-3B)">
                            <option value='{"repo": "Qwen/Qwen2.5-0.5B-Instruct-GGUF", "file": "qwen2.5-0.5b-instruct-q4_k_m.gguf", "size": "397 MB"}'>Qwen 2.5 0.5B Instruct (397 MB)</option>
                            <option value='{"repo": "Qwen/Qwen2.5-1.5B-Instruct-GGUF", "file": "qwen2.5-1.5b-instruct-q4_k_m.gguf", "size": "1.1 GB"}'>Qwen 2.5 1.5B Instruct (1.1 GB)</option>
                            <option value='{"repo": "Qwen/Qwen2.5-3B-Instruct-GGUF", "file": "qwen2.5-3b-instruct-q4_k_m.gguf", "size": "2.1 GB"}'>Qwen 2.5 3B Instruct (2.1 GB)</option>
                            <option value='{"repo": "microsoft/Phi-3.5-mini-instruct-gguf", "file": "Phi-3.5-mini-instruct-Q4_K_M.gguf", "size": "2.4 GB"}'>Phi 3.5 Mini Instruct (2.4 GB)</option>
                            <option value='{"repo": "HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF", "file": "smollm2-1.7b-instruct-q4_k_m.gguf", "size": "1.0 GB"}'>SmolLM2 1.7B Instruct (1.0 GB)</option>
                        </optgroup>
                        <optgroup label="Medium (4-8B)">
                            <option value='{"repo": "Qwen/Qwen2.5-7B-Instruct-GGUF", "file": "qwen2.5-7b-instruct-q4_k_m.gguf", "size": "4.7 GB"}'>Qwen 2.5 7B Instruct (4.7 GB)</option>
                            <option value='{"repo": "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF", "file": "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf", "size": "4.9 GB"}'>Llama 3.1 8B Instruct (4.9 GB)</option>
                            <option value='{"repo": "bartowski/gemma-2-9b-it-GGUF", "file": "gemma-2-9b-it-Q4_K_M.gguf", "size": "5.6 GB"}'>Gemma 2 9B IT (5.6 GB)</option>
                            <option value='{"repo": "bartowski/Mistral-7B-Instruct-v0.3-GGUF", "file": "Mistral-7B-Instruct-v0.3-Q4_K_M.gguf", "size": "4.4 GB"}'>Mistral 7B Instruct v0.3 (4.4 GB)</option>
                            <option value='{"repo": "QuantFactory/DeepSeek-R1-Distill-Qwen-7B-GGUF", "file": "DeepSeek-R1-Distill-Qwen-7B.Q4_K_M.gguf", "size": "4.7 GB"}'>DeepSeek R1 Distill Qwen 7B (4.7 GB)</option>
                        </optgroup>
                        <optgroup label="Large (14B+)">
                            <option value='{"repo": "Qwen/Qwen2.5-14B-Instruct-GGUF", "file": "qwen2.5-14b-instruct-q4_k_m.gguf", "size": "8.8 GB"}'>Qwen 2.5 14B Instruct (8.8 GB)</option>
                            <option value='{"repo": "bartowski/Qwen2.5-32B-Instruct-GGUF", "file": "Qwen2.5-32B-Instruct-Q4_K_M.gguf", "size": "20.1 GB"}'>Qwen 2.5 32B Instruct (20.1 GB)</option>
                        </optgroup>
                    </select>
                    <div id="hf-info" class="info-text muted" style="display: none;"></div>
                </div>

                <div class="tab-content" id="local-tab">
                    <div class="file-drop-zone" id="file-drop-zone">
                        <p>Drag and drop a .gguf file here, or click to select</p>
                        <input type="file" id="local-file-input" accept=".gguf" style="display: none;">
                        <button class="btn-secondary" id="browse-btn">Browse Files</button>
                    </div>
                    <div id="local-info" class="info-text muted" style="display: none;"></div>
                </div>
            </section>

            <!-- USB Drive Section -->
            <section class="card">
                <div class="card-header">
                    <h2>USB Drive</h2>
                    <button class="btn-secondary small" id="refresh-drives-btn">Refresh</button>
                </div>
                
                <div id="drives-container" class="drives-list">
                    <p class="muted">Scanning for USB drives...</p>
                </div>
            </section>

            <!-- Action Section -->
            <section class="action-section">
                <button id="flash-btn" class="btn-primary" disabled>⚡ Flash Drive</button>
                
                <div id="progress-container" class="progress-container" style="display: none;">
                    <div class="progress-header">
                        <span id="progress-status" class="status-text">Starting...</span>
                        <span id="progress-percent" class="percent-text">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                    <div id="progress-subtext" class="subtext muted"></div>
                </div>

                <div id="success-message" class="success-message" style="display: none;">
                    Successfully flashed the drive!
                </div>
                <div id="error-message" class="error-message" style="display: none;"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
